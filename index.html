<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mein Budget 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#0F0F13;--bg2:#1A1A22;--bg3:rgba(255,255,255,0.04);
    --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
    --text:#F0EDE8;--text2:#999;--text3:#666;--text4:#444;
    --green:#5C8A5C;--blue:#4A7FA5;--orange:#D4845A;--red2:#E05252;
  }
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}
  header{background:linear-gradient(135deg,var(--bg2),#141418);border-bottom:1px solid var(--border);padding:28px 20px 18px;padding-top:max(28px,env(safe-area-inset-top,28px));position:sticky;top:0;z-index:100}
  .hi{max-width:680px;margin:0 auto}
  .ht{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
  .lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:4px}
  h1{font-size:22px;font-weight:600;letter-spacing:-0.5px}
  .tabs{display:flex;gap:6px}
  .tab{padding:7px 16px;border-radius:20px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;border:none;background:var(--bg3);color:var(--text2);-webkit-tap-highlight-color:transparent;transition:all 0.15s}
  .tab.active{background:var(--text);color:var(--bg);font-weight:600}
  .mnav{display:flex;align-items:center;gap:10px}
  .nb{background:rgba(255,255,255,0.07);border:none;border-radius:8px;width:32px;height:32px;color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
  .nb:active{background:rgba(255,255,255,0.15)}
  .ml{font-size:16px;font-weight:500;flex:1;text-align:center}
  main{max-width:680px;margin:0 auto;padding:18px 16px 100px}
  .sg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:13px}
  .sc{background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:12px 13px}
  .sl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;margin-bottom:5px}
  .sv{font-size:17px;font-weight:600;margin-bottom:2px;font-variant-numeric:tabular-nums}
  .ss{font-size:10px;color:var(--text3)}
  .fb{background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:11px 15px;margin-bottom:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .cg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
  .cc{background:var(--bg3);border:1px solid var(--border);border-radius:13px;padding:14px;position:relative;overflow:hidden;transition:transform 0.15s,border-color 0.2s}
  .cc:active{transform:scale(0.98)}.cc.over{border-color:rgba(224,82,82,0.4)}
  .ca{position:absolute;top:0;left:0;right:0;height:2px;border-radius:13px 13px 0 0;opacity:0.65}
  .ct{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
  .ci{font-size:19px}.cn{font-size:11px;color:var(--text2);margin-top:3px;line-height:1.2}
  .cam{display:flex;align-items:baseline;gap:5px;margin-bottom:10px}
  .cs{font-size:20px;font-weight:600;font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums}
  .co{font-size:11px;color:var(--text4);font-family:'DM Mono',monospace}
  .pb{height:3px;background:rgba(255,255,255,0.07);border-radius:2px;margin-bottom:11px;overflow:hidden}
  .pf{height:100%;border-radius:2px;transition:width 0.5s cubic-bezier(.4,0,.2,1)}
  .cac{display:flex;gap:5px}
  .cb{flex:1;background:rgba(255,255,255,0.06);border:none;border-radius:7px;padding:7px 0;color:var(--text2);font-size:11px;font-family:'DM Sans',sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .cb:active{background:rgba(255,255,255,0.12)}
  .ir{display:flex;gap:6px;margin-bottom:10px}
  .ii{flex:1;background:rgba(255,255,255,0.09);border:1px solid var(--border2);border-radius:7px;padding:7px 9px;color:var(--text);font-size:14px;font-family:'DM Mono',monospace;-webkit-appearance:none}
  .ii:focus{outline:none;border-color:rgba(255,255,255,0.3)}
  .io{border:none;border-radius:7px;padding:7px 13px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent}
  .be{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:13px;padding:15px 16px}
  .bg2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .br{display:flex;align-items:center;gap:7px}
  .bi{width:58px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:7px;padding:4px 7px;color:var(--text);font-size:12px;text-align:right;font-family:'DM Mono',monospace;-webkit-appearance:none}
  .bi:focus{outline:none;border-color:rgba(255,255,255,0.25)}
  .sb{background:rgba(74,127,165,0.1);border:1px solid rgba(74,127,165,0.25);border-radius:11px;padding:11px 15px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
  .sd{width:7px;height:7px;border-radius:50%;background:#4A7FA5;flex-shrink:0;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .hc{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:10px}
  .hc.over{border-color:rgba(224,82,82,0.25)}
  .hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
  .hbars{display:flex;gap:3px;height:38px;align-items:flex-end;margin-bottom:5px}
  .hbar{flex:1;border-radius:3px 3px 0 0;opacity:0.75;min-height:2px}
  .hicons{display:flex;gap:3px}
  .hic{flex:1;text-align:center;font-size:10px}
  .hd{display:grid;grid-template-columns:repeat(3,1fr);gap:5px 10px;margin-top:11px}
  .hdi{font-size:11px;color:var(--text3)}
  .hdv{font-family:'DM Mono',monospace;margin-top:1px;font-size:11px}
  #toast{position:fixed;bottom:max(28px,env(safe-area-inset-bottom,28px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 22px;border-radius:24px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;z-index:999;white-space:nowrap;transition:all 0.25s cubic-bezier(.4,0,.2,1);box-shadow:0 4px 20px rgba(0,0,0,0.5)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 20px}
  #toast button{background:var(--bg);color:var(--text);border:none;border-radius:16px;padding:6px 12px;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer}
  .cc.wide{grid-column:1/-1}
  .bk.warn{border-color:rgba(212,132,90,0.35)}
  .sv2{background:rgba(92,138,92,0.08);border-color:rgba(92,138,92,0.25)}.sv2.warn{background:rgba(224,82,82,0.08);border-color:rgba(224,82,82,0.3)}
  .ii.nt{font-family:'DM Sans',sans-serif;font-size:13px}
  .el{margin:0 0 11px;border-top:1px solid var(--border)}
  .er{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
  .er.edit{flex-wrap:wrap;padding:8px 0}.er.edit .ii{flex:1 1 120px}
  .eb{display:flex;gap:6px;width:100%}.eb .cb{flex:1}.cb.del{color:#E05252}
  .ed{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);flex-shrink:0}
  .en{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
  .ea{font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums;flex-shrink:0}
  .ib{background:none;border:none;font-size:14px;cursor:pointer;padding:6px;border-radius:6px;flex-shrink:0;-webkit-tap-highlight-color:transparent}
  .ib:active{background:rgba(255,255,255,0.1)}
  .empty{font-size:12px;color:var(--text3);padding:4px 0 12px}
  #saving{position:fixed;top:14px;right:14px;font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;opacity:0;transition:opacity 0.3s;z-index:200}
  #saving.show{opacity:1}
  @media(max-width:430px){.sg{grid-template-columns:1fr 1fr}.sg .sc:last-child{grid-column:span 2}.cg{grid-template-columns:1fr}.bg2{grid-template-columns:1fr}.hd{grid-template-columns:1fr 1fr}h1{font-size:19px}.sv{font-size:15px}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fade{animation:fadeUp 0.28s ease}
</style>
</head>
<body>
<header>
  <div class="hi">
    <div class="ht">
      <div><div class="lbl">Mein Budget</div><h1>Finanzübersicht 2026</h1></div>
      <div class="tabs">
        <button class="tab active" onclick="setView('month')">Monat</button>
        <button class="tab" onclick="setView('history')">Verlauf</button>
      </div>
    </div>
    <div class="mnav">
      <button class="nb" onclick="prevMonth()">‹</button>
      <div class="ml" id="monthLabel"></div>
      <button class="nb" onclick="nextMonth()">›</button>
    </div>
  </div>
</header>
<main>
  <div id="vm"></div>
  <div id="vh" style="display:none"></div>
</main>
<div id="toast"></div>
<div id="saving">💾 speichert…</div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importBackup(this)">
<script>
const CATS=[
  {id:"alltag",label:"Lebensmittel, Drogerie & Gesundheit",short:"Alltag",icon:"🛒",color:"#5C8A5C",def:350},
  {id:"essen",label:"Restaurants, Cafés & Bars",short:"Gastro",icon:"🍷",color:"#C8553D",def:400},
  {id:"kultur",label:"Kultur & Events",short:"Kultur",icon:"🎭",color:"#B5838D",def:120},
  {id:"mobil",label:"Mobilität",short:"Mobilität",icon:"🚕",color:"#C9A227",def:80},
  {id:"reise",label:"Reisen",short:"Reisen",icon:"✈️",color:"#4A7FA5",def:300},
  {id:"kleidung",label:"Kleidung & Shopping",short:"Kleidung",icon:"🛍️",color:"#8B6F9B",def:110},
  {id:"geschenke",label:"Geschenke",short:"Geschenke",icon:"🎁",color:"#D4845A",def:80},
  {id:"sonstiges",label:"Sonstiges & Bargeld",short:"Sonstiges",icon:"💶",color:"#8A7A5C",def:150},
];
const MONTHS=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const SALARY=3519,FIXED=1424,ETF=202,SAVE=300; // SAVE: Sparziel pro Monat (zusätzlich zum ETF)
const VARIABLE=SALARY-FIXED-ETF-SAVE;
const SK="meinBudget2026_v3",OLD_SK="meinBudget2026_v2";
// Alte Kategorien (bis Version 2) und wohin sie übertragen werden
const OLD_CATS={gastro:["essen","Gastronomie & Bars"],shopping:["kleidung","Shopping & Mode"],reise:["reise","Reise & Freizeit"],lebens:["alltag","Lebensmittel & Drogerie"],geschenke:["geschenke","Geschenke"],bargeld:["sonstiges","Bargeld & Diverses"]};
const SEED={"2026-0":{gastro:620,shopping:310,reise:888,lebens:80,geschenke:90,bargeld:250},"2026-1":{gastro:780,shopping:420,reise:650,lebens:85,geschenke:95,bargeld:250},"2026-2":{gastro:870,shopping:860,reise:545,lebens:90,geschenke:340,bargeld:200},"2026-3":{gastro:300,shopping:180,reise:431,lebens:70,geschenke:80,bargeld:100}};
// S.entries: {"2026-9":[{id,cat,amt,note,date}]}
let S={year:2026,month:new Date().getMonth(),view:"month",entries:{},budgets:Object.fromEntries(CATS.map(c=>[c.id,c.def])),open:null,mode:null,editId:null,lastBackup:null};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round(n*100)/100;
function convertOld(k,totals,fromStatement){const[y,m]=k.split("-").map(Number),date=new Date(y,m,1).toISOString().slice(0,10);return Object.entries(totals).filter(([o,v])=>OLD_CATS[o]&&v>0).map(([o,v])=>({id:uid(),cat:OLD_CATS[o][0],amt:r2(v),note:(fromStatement?"Aus Kontoauszug":"Übertrag")+" ("+OLD_CATS[o][1]+")",date}));}
function load(){
  let ok=false;
  try{const r=localStorage.getItem(SK);if(r){const d=JSON.parse(r);if(d.entries)S.entries=d.entries;if(d.budgets)Object.assign(S.budgets,d.budgets);if(d.lastBackup)S.lastBackup=d.lastBackup;ok=true;}}catch(e){}
  if(!ok){try{const r=localStorage.getItem(OLD_SK);if(r){const d=JSON.parse(r);Object.entries(d.history||{}).forEach(([k,v])=>{S.entries[k]=convertOld(k,v,k in SEED);});}}catch(e){}}
  Object.entries(SEED).forEach(([k,v])=>{if(!S.entries[k])S.entries[k]=convertOld(k,v,true);});
  if(!ok)saveNow();
}
let st=null;
function saveNow(){try{localStorage.setItem(SK,JSON.stringify({entries:S.entries,budgets:S.budgets,lastBackup:S.lastBackup}));}catch(e){}}
function save(){saveNow();const el=document.getElementById("saving");el.classList.add("show");clearTimeout(st);st=setTimeout(()=>el.classList.remove("show"),400);}
const key=(y,m)=>`${y}-${m}`;
const ckey=()=>key(S.year,S.month);
const list=(k=ckey())=>S.entries[k]||(S.entries[k]=[]);
const tot=(k,cat)=>r2((S.entries[k]||[]).filter(e=>e.cat===cat).reduce((a,e)=>a+e.amt,0));
const gs=cat=>tot(ckey(),cat);
const fmt=n=>n.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const num=n=>n.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});
const parseAmount=t=>{t=String(t).trim().replace(/\s|€/g,"");if(t.includes(","))t=t.replace(/\./g,"").replace(",",".");return parseFloat(t);};
const fdate=d=>{const[y,m,dd]=d.split("-");return dd+"."+m+".";};
function entryDate(){const now=new Date();if(now.getFullYear()===S.year&&now.getMonth()===S.month)return new Date(S.year,S.month,now.getDate(),12).toISOString().slice(0,10);return new Date(S.year,S.month,1,12).toISOString().slice(0,10);}
function ring(pct,color,sz=52){const r=sz/2-6,circ=2*Math.PI*r,dash=Math.min(pct/100,1)*circ,c=pct>100?"#E05252":color;return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" style="transform:rotate(-90deg);flex-shrink:0"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="5"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${dash} ${circ}" style="transition:stroke-dasharray 0.5s cubic-bezier(.4,0,.2,1)"/></svg>`;}
let tt=null,undoFn=null;
function toast(msg,undo){const el=document.getElementById("toast");undoFn=undo||null;el.innerHTML=esc(msg)+(undo?`<button onclick="doUndo()">Rückgängig</button>`:"");el.classList.toggle("act",!!undo);el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>{el.classList.remove("show","act");undoFn=null;},undo?6000:2200);}
function doUndo(){if(undoFn){undoFn();undoFn=null;save();render();}const el=document.getElementById("toast");clearTimeout(tt);el.classList.remove("act");el.textContent="Rückgängig gemacht ✓";tt=setTimeout(()=>el.classList.remove("show"),1500);}
function closeAll(){S.open=null;S.mode=null;S.editId=null;}
function prevMonth(){if(S.month===0){S.month=11;S.year--;}else S.month--;closeAll();render();}
function nextMonth(){if(S.month===11){S.month=0;S.year++;}else S.month++;closeAll();render();}
function setView(v){S.view=v;closeAll();render();}
function focus(id){setTimeout(()=>{const el=document.getElementById(id);if(el)el.focus();},60);}
function toggle(cat,mode){if(S.open===cat&&S.mode===mode)closeAll();else{S.open=cat;S.mode=mode;S.editId=null;}render();if(S.mode==="add")focus("amt-"+cat);}
function addEntry(cat){
  const a=document.getElementById("amt-"+cat),n=document.getElementById("note-"+cat);if(!a)return;
  const v=parseAmount(a.value);
  if(isNaN(v)||v<=0){a.focus();toast("Bitte einen Betrag eingeben");return;}
  const e={id:uid(),cat,amt:r2(v),note:n?n.value.trim():"",date:entryDate()},k=ckey();
  list(k).push(e);save();closeAll();render();
  toast("+ "+fmt(e.amt)+" eingetragen ✓",()=>{S.entries[k]=list(k).filter(x=>x.id!==e.id);});
}
function delEntry(id){
  const k=ckey(),arr=list(k),i=arr.findIndex(e=>e.id===id);if(i<0)return;
  const [e]=arr.splice(i,1);save();S.editId=null;render();
  toast("Gelöscht: "+fmt(e.amt),()=>{list(k).splice(i,0,e);});
}
function startEditEntry(id){S.editId=S.editId===id?null:id;render();if(S.editId)focus("eamt-"+id);}
function saveEntry(id){
  const e=list().find(x=>x.id===id);if(!e)return;
  const v=parseAmount(document.getElementById("eamt-"+id).value);
  if(isNaN(v)||v<=0){toast("Bitte einen Betrag eingeben");return;}
  const old={...e};e.amt=r2(v);e.note=document.getElementById("enote-"+id).value.trim();
  save();S.editId=null;render();
  toast("Geändert ✓",()=>{Object.assign(e,old);});
}
function onKey(ev,fn){if(ev.key==="Enter"){ev.preventDefault();fn();}if(ev.key==="Escape"){closeAll();render();}}
function updateBudget(id,val){S.budgets[id]=Math.max(0,Math.round(parseAmount(val))||0);save();renderMonth();}
function render(){
  document.getElementById("monthLabel").textContent=MONTHS[S.month]+" "+S.year;
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",(i===0&&S.view==="month")||(i===1&&S.view==="history")));
  document.getElementById("vm").style.display=S.view==="month"?"":"none";
  document.getElementById("vh").style.display=S.view==="history"?"":"none";
  if(S.view==="month")renderMonth();else renderHistory();
}
function entryList(cat){
  const items=list().filter(e=>e.cat===cat.id).slice().reverse();
  if(!items.length)return `<div class="empty">Noch keine Ausgaben in diesem Monat.</div>`;
  return `<div class="el">`+items.map(e=>{
    if(S.editId===e.id)return `<div class="er edit"><input class="ii" id="eamt-${e.id}" type="text" inputmode="decimal" autocomplete="off" value="${num(e.amt)}" onkeydown="onKey(event,()=>saveEntry('${e.id}'))"><input class="ii nt" id="enote-${e.id}" type="text" placeholder="Notiz" value="${esc(e.note)}" onkeydown="onKey(event,()=>saveEntry('${e.id}'))"><div class="eb"><button class="io" style="background:${cat.color}" onclick="saveEntry('${e.id}')">Speichern</button><button class="cb" onclick="startEditEntry('${e.id}')">Abbrechen</button><button class="cb del" onclick="delEntry('${e.id}')">🗑 Löschen</button></div></div>`;
    return `<div class="er"><span class="ed">${fdate(e.date)}</span><span class="en">${e.note?esc(e.note):'<span style="color:var(--text3)">Ausgabe</span>'}</span><span class="ea">${fmt(e.amt)}</span><button class="ib" title="Bearbeiten" onclick="startEditEntry('${e.id}')">✏️</button><button class="ib" title="Löschen" onclick="delEntry('${e.id}')">🗑</button></div>`;
  }).join("")+`</div>`;
}
function renderMonth(){
  const ts=r2(CATS.reduce((a,c)=>a+gs(c.id),0)),rem=VARIABLE-ts,saved=r2(SAVE+rem),bsum=CATS.reduce((a,c)=>a+S.budgets[c.id],0);
  let h=`<div class="sg">
    <div class="sc"><div class="sl">Gehalt netto</div><div class="sv" style="color:#5C8A5C">${fmt(SALARY)}</div><div class="ss">E.ON Foundation</div></div>
    <div class="sc"><div class="sl">Ausgegeben</div><div class="sv" style="color:${ts>VARIABLE?"#E05252":"#D4845A"}">${fmt(ts)}</div><div class="ss">von ${fmt(VARIABLE)}</div></div>
    <div class="sc"><div class="sl">${rem<0?"Überzogen":"Verbleibend"}</div><div class="sv" style="color:${rem<0?"#E05252":"#4A7FA5"}">${fmt(Math.abs(rem))}</div><div class="ss">${rem<0?"⚠ geht vom Sparziel ab":"noch frei"}</div></div>
  </div>
  <div class="fb sv2${saved<SAVE?" warn":""}"><div><div class="lbl" style="margin-bottom:3px">Sparziel ${fmt(SAVE)}</div><div style="font-size:11px;color:#777">${saved>=SAVE?"✓ Auf Kurs: das Sparziel ist schon vom Budget abgezogen":saved>0?"⚠ Du hast "+fmt(SAVE-saved)+" mehr ausgegeben als geplant":"⚠ Diesen Monat bleibt nichts zum Sparen übrig"}</div></div><div style="text-align:right"><div class="lbl" style="margin-bottom:3px">Gespart</div><div style="font-size:17px;font-weight:600;white-space:nowrap;color:${saved>=SAVE?"#5C8A5C":"#E05252"}">${fmt(Math.max(0,Math.min(SAVE,saved)))}</div></div></div>
  <div class="fb"><div><div class="lbl" style="margin-bottom:3px">Fixkosten (auto)</div><div style="font-size:11px;color:#777">Miete · BVG · Versicherungen · Telekom · Strom · Gewerkschaft · Abos · ETF</div></div><div style="font-size:17px;font-weight:600;white-space:nowrap">${fmt(FIXED+ETF)}</div></div>
  <div class="cg">`;
  CATS.forEach(cat=>{
    const s=gs(cat.id),b=S.budgets[cat.id],pct=b>0?(s/b)*100:0,over=s>b,open=S.open===cat.id,n=list().filter(e=>e.cat===cat.id).length;
    h+=`<div class="cc${over?" over":""}${open&&S.mode==="list"?" wide":""}"><div class="ca" style="background:${cat.color}"></div>
      <div class="ct"><div><div class="ci">${cat.icon}</div><div class="cn">${cat.label}</div></div>${ring(pct,cat.color)}</div>`;
    if(open&&S.mode==="add"){h+=`<div class="ir"><input class="ii" id="amt-${cat.id}" type="text" placeholder="Betrag, z.B. 12,50" inputmode="decimal" autocomplete="off" onkeydown="onKey(event,()=>addEntry('${cat.id}'))"><button class="io" style="background:${cat.color}" onclick="addEntry('${cat.id}')">OK</button></div><div class="ir"><input class="ii nt" id="note-${cat.id}" type="text" placeholder="Notiz (optional), z.B. Lidl" autocomplete="off" onkeydown="onKey(event,()=>addEntry('${cat.id}'))"></div>`;}
    else{h+=`<div class="cam"><span class="cs" style="color:${over?"#E05252":"#F0EDE8"}">${num(s)}</span><span class="co">/ ${b} €</span></div>`;}
    h+=`<div class="pb"><div class="pf" style="width:${Math.min(pct,100)}%;background:${over?"#E05252":cat.color}"></div></div>`;
    if(open&&S.mode==="list")h+=entryList(cat);
    h+=`<div class="cac"><button class="cb" onclick="toggle('${cat.id}','add')">${open&&S.mode==="add"?"Abbrechen":"+ Ausgabe"}</button><button class="cb" onclick="toggle('${cat.id}','list')">${open&&S.mode==="list"?"Schließen":"Liste ("+n+")"}</button></div></div>`;
  });
  h+=`</div><div class="be" style="margin-top:13px"><div class="lbl" style="margin-bottom:6px">Budget anpassen</div><div style="font-size:11px;color:${bsum>VARIABLE?"#E05252":"#777"};margin-bottom:12px">Verteilt: ${fmt(bsum)} von ${fmt(VARIABLE)}${bsum>VARIABLE?" · ⚠ mehr als verfügbar, das Sparziel wäre nicht erreichbar":""}</div><div class="bg2">`;
  CATS.forEach(cat=>{h+=`<div class="br"><span style="font-size:13px">${cat.icon}</span><span style="font-size:12px;color:#777;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cat.short}</span><input class="bi" type="text" value="${S.budgets[cat.id]}" inputmode="numeric" onchange="updateBudget('${cat.id}',this.value)"><span style="font-size:11px;color:#444">€</span></div>`;});
  h+=`</div></div>`;
  h+=backupBox();
  document.getElementById("vm").innerHTML=h;
}
// ---------- Backup ----------
function backupBox(){
  const days=S.lastBackup?Math.floor((Date.now()-new Date(S.lastBackup))/864e5):null,old=days===null||days>=7;
  const info=S.lastBackup?"Letztes Backup: "+new Date(S.lastBackup).toLocaleDateString("de-DE")+(days>=7?" · ⚠ älter als 7 Tage":""):"⚠ Noch kein Backup gespeichert";
  return `<div class="be bk${old?" warn":""}" style="margin-top:13px"><div class="lbl" style="margin-bottom:6px">Backup</div><div style="font-size:11px;color:${old?"#D4845A":"#777"};margin-bottom:6px">${info}</div><div style="font-size:11px;color:#555;margin-bottom:12px;line-height:1.4">Safari kann gespeicherte Daten löschen, wenn du den Tracker 7 Tage nicht öffnest. Sichere deine Einträge deshalb regelmäßig als Datei, z.B. in iCloud Drive.</div><div class="cac"><button class="cb" onclick="exportBackup()">💾 Backup speichern</button><button class="cb" onclick="document.getElementById('importFile').click()">📂 Backup laden</button></div></div>`;
}
async function exportBackup(){
  const now=new Date(),d=now.toISOString().slice(0,10);
  const data=JSON.stringify({app:"meinBudget",version:3,exported:now.toISOString(),entries:S.entries,budgets:S.budgets},null,1);
  const name="Budget-Backup-"+d+".json",file=new File([data],name,{type:"application/json"});
  let done=false;
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});done=true;}}
  catch(e){if(e&&e.name==="AbortError"){toast("Backup abgebrochen");return;}}
  if(!done){const url=URL.createObjectURL(file),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
  S.lastBackup=now.toISOString();saveNow();render();toast("Backup gespeichert ✓");
}
function importBackup(input){
  const f=input.files&&input.files[0];input.value="";if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let d;try{d=JSON.parse(rd.result);}catch(e){toast("Diese Datei ist kein gültiges Backup");return;}
    if(!d||d.app!=="meinBudget"||typeof d.entries!=="object"){toast("Diese Datei ist kein gültiges Backup");return;}
    const n=Object.values(d.entries).reduce((a,l)=>a+(Array.isArray(l)?l.length:0),0);
    if(!confirm("Backup vom "+new Date(d.exported).toLocaleDateString("de-DE")+" laden ("+n+" Einträge)?\n\nAlle aktuellen Einträge werden dabei ersetzt."))return;
    const before={entries:S.entries,budgets:{...S.budgets}};
    S.entries=d.entries;if(d.budgets)Object.assign(S.budgets,d.budgets);closeAll();save();render();
    toast("Backup geladen ✓",()=>{S.entries=before.entries;S.budgets=before.budgets;});
  };
  rd.readAsText(f);
}
function renderHistory(){
  const keys=Object.keys(S.entries).filter(k=>S.entries[k].length).sort((a,b)=>{const[ay,am]=a.split("-").map(Number),[by,bm]=b.split("-").map(Number);return ay-by||am-bm;}).slice(-8).reverse();
  const tb=VARIABLE;
  let h=`<p style="font-size:13px;color:#555;margin:0 0 14px">Letzte ${keys.length} Monate · gespeichert in diesem Browser</p>`;
  keys.forEach(k=>{
    const[y,m]=k.split("-"),vals=Object.fromEntries(CATS.map(c=>[c.id,tot(k,c.id)]));
    const total=r2(Object.values(vals).reduce((a,b)=>a+b,0)),over=total>tb,isSeed=k in SEED;
    const cm=Math.max(...Object.values(vals),1);
    h+=`<div class="hc${over?" over":""}"><div class="hh"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:14px;font-weight:500">${MONTHS[parseInt(m)]} ${y}</span>${isSeed?`<span style="font-size:9px;color:#444;font-family:'DM Mono',monospace">aus Kontoauszug</span>`:""}</div><span style="font-size:16px;font-weight:600;color:${over?"#E05252":"#5C8A5C"};font-family:'DM Mono',monospace">${fmt(total)}</span></div>
    <div class="hbars">`;
    CATS.forEach(cat=>{const v=vals[cat.id],hh=Math.max((v/cm)*34,v>0?3:0);h+=`<div class="hbar" style="height:${hh}px;background:${cat.color}" title="${cat.label}: ${fmt(v)}"></div>`;});
    h+=`</div><div class="hicons">`;
    CATS.forEach(cat=>{h+=`<div class="hic">${cat.icon}</div>`;});
    h+=`</div><div class="hd">`;
    CATS.forEach(cat=>{const v=vals[cat.id],b=S.budgets[cat.id];h+=`<div class="hdi">${cat.icon} ${cat.short}<div class="hdv" style="color:${v>b?"#E05252":"#888"}">${fmt(v)}</div></div>`;});
    h+=`</div></div>`;
  });
  h+=`<div style="background:rgba(255,255,255,0.02);border-radius:10px;padding:11px 14px;margin-top:4px"><p style="font-size:11px;color:#3a3a3a;text-align:center;font-family:'DM Mono',monospace;margin:0">Januar bis April aus deinen Kontoauszügen, in die neuen Kategorien übertragen</p></div>`;
  document.getElementById("vh").innerHTML=h;
}
load();render();
</script>
